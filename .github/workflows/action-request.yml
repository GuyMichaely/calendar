name: Agent action request
run-name: ${{ github.event.head_commit.message }}

on:
  push:
    branches:
      - action-trigger
    paths:
      - action-request.json

jobs:
  dispatch:
    permissions:
      contents: write
      actions: write
    uses: GuyMichaely/calendar/.github/workflows/dispatch-request.yml@deployment-control
    with:
      request_commit: ${{ github.sha }}
