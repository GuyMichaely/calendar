name: Deploy Calendar Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Calendar CI"]
    types: [completed]
    branches:
      - agent/vanilla-refactor
      - agent/solid-refactor

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Check out deployment tooling
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check out main app
        uses: actions/checkout@v4
        with:
          ref: main
          path: .sources/main

      - name: Check out vanilla preview
        uses: actions/checkout@v4
        with:
          ref: agent/vanilla-refactor
          path: .sources/vanilla

      - name: Check out Solid preview
        uses: actions/checkout@v4
        with:
          ref: agent/solid-refactor
          path: .sources/solid

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test main app
        run: npm test
        working-directory: .sources/main

      - name: Test vanilla preview
        run: npm test
        working-directory: .sources/vanilla

      - name: Install Solid dependencies
        run: npm install --no-audit --no-fund
        working-directory: .sources/solid

      - name: Test Solid preview
        run: npm test && npm run test:solid
        working-directory: .sources/solid

      - name: Typecheck Solid preview
        run: npm run typecheck:solid
        working-directory: .sources/solid

      - name: Build Solid preview
        run: npm run build:solid
        working-directory: .sources/solid

      - name: Assemble Pages artifact
        run: >-
          node scripts/assemble-pages.mjs
          .sources/main/site
          .sources/vanilla/site
          .sources/solid/site/solid
          .pages-dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
