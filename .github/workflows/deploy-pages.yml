name: Verify and deploy Calendar

on:
  push:
    branches: [main, 'prototype*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One production stream, including verification; never interrupt a deployment.
# Prototype pushes verify in their own group, then republish through production.
concurrency:
  group: calendar-${{ (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/prototype')) && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install locked dependencies
        run: ./scripts/bun install --frozen-lockfile
      - name: Test, typecheck, and build
        run: ./scripts/bun run check
      - name: Smoke test Cloudflare adapter
        run: ./scripts/bun scripts/smoke-worker.js
      - name: Validate container configuration
        run: |
          cp backend/.env.example .local/backend.env
          ./scripts/container config --quiet
          printf 'TUNNEL_TOKEN=ci-placeholder\n' > .local/cloudflare.env
          ./scripts/container --profile cloudflare config --quiet
          docker run --rm cloudflare/cloudflared:2026.8.3 --version
      - name: Build backend container
        run: docker build --build-arg BUN_VERSION="$(cat .bun-version)" -f backend/Dockerfile -t calendar-backend .
      - name: Smoke test backend container
        run: ./scripts/smoke-container
      - name: Build prototypes
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          # Each prototype* branch is published at /calendar/<branch>/ beside production.
          git fetch --no-tags origin '+refs/heads/prototype*:refs/remotes/origin/prototype*'
          for ref in $(git for-each-ref --format='%(refname:strip=3)' 'refs/remotes/origin/prototype*'); do
            if ! [[ "$ref" =~ ^prototype[a-z0-9-]*$ ]]; then echo "::warning::Skipping $ref: use lowercase letters, digits, and hyphens"; continue; fi
            tree="$RUNNER_TEMP/$ref"
            git worktree add --detach "$tree" "origin/$ref"
            if "$tree/scripts/bun" install --frozen-lockfile && VITE_CALENDAR_PRIMARY_BASE=/calendar/ "$tree/scripts/bun" run build:solid --base "/calendar/$ref/"; then
              cp -R "$tree/dist" "dist/$ref"
            else
              echo "::warning::Prototype $ref failed to build and was not published"
            fi
          done
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload frontend
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Pages accepts deployments only from main, so a verified prototype push republishes main.
  publish-prototype:
    if: startsWith(github.ref, 'refs/heads/prototype') && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Republish main with prototypes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
