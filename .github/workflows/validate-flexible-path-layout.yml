name: Validate flexible deployment paths

on:
  push:
    branches:
      - deployment-control
    paths:
      - .github/workflows/validate-flexible-path-layout.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deployment-control

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate no-root and nested layouts
        shell: bash
        run: |
          set -euo pipefail
          SHA="04d65983449bacf9ee236a1e25a592faa13a18a7"

          cat > /tmp/no-root.json <<JSON
          {
            "units": {
              "child1": {"path": "/parent/child1/", "revision": "$SHA"},
              "child2": {"path": "/parent/child2/", "revision": "$SHA"}
            }
          }
          JSON
          mkdir -p /tmp/no-root-sources/child1 /tmp/no-root-sources/child2
          printf 'child1\n' > /tmp/no-root-sources/child1/index.html
          printf 'child2\n' > /tmp/no-root-sources/child2/index.html
          node scripts/assemble-pages.mjs /tmp/no-root.json /tmp/no-root-sources /tmp/no-root-output
          test "$(cat /tmp/no-root-output/parent/child1/index.html)" = "child1"
          test "$(cat /tmp/no-root-output/parent/child2/index.html)" = "child2"
          test ! -e /tmp/no-root-output/index.html

          cat > /tmp/nested.json <<JSON
          {
            "units": {
              "parent": {"path": "/parent/", "revision": "$SHA"},
              "child": {"path": "/parent/child/", "revision": "$SHA"}
            }
          }
          JSON
          mkdir -p /tmp/nested-sources/parent/child /tmp/nested-sources/child
          printf 'parent\n' > /tmp/nested-sources/parent/index.html
          printf 'stale child\n' > /tmp/nested-sources/parent/child/stale.txt
          printf 'child\n' > /tmp/nested-sources/child/index.html
          node scripts/assemble-pages.mjs /tmp/nested.json /tmp/nested-sources /tmp/nested-output
          test "$(cat /tmp/nested-output/parent/index.html)" = "parent"
          test "$(cat /tmp/nested-output/parent/child/index.html)" = "child"
          test ! -e /tmp/nested-output/parent/child/stale.txt

          cp /tmp/no-root.json /tmp/promote.json
          node scripts/update-manifest.mjs /tmp/promote.json child3 "$SHA" /parent/child3/
          test "$(jq -r '.units.child3.path' /tmp/promote.json)" = "/parent/child3/"
