name: Old branch control

on:
  push:
    branches:
      - reference/pre-preview-deployment-main
      - deploy/old

jobs:
  test-and-build:
    if: github.ref_name == 'reference/pre-preview-deployment-main'
    permissions:
      contents: read
    uses: GuyMichaely/calendar/.github/workflows/test-and-build-candidate.yml@deployment-control
    with:
      unit: old
      commit: ${{ github.sha }}

  promote:
    if: github.ref_name == 'deploy/old'
    permissions:
      contents: write
      actions: write
    uses: GuyMichaely/calendar/.github/workflows/promote-deployment.yml@deployment-control
    with:
      unit: old
      commit: ${{ github.sha }}
