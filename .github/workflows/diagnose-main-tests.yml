name: Diagnose main tests

on:
  push:
    branches:
      - deployment-control
    paths:
      - .github/workflows/diagnose-main-tests.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Root tests
        id: root
        continue-on-error: true
        run: npm test

      - name: Solid tests
        id: solid
        if: always()
        continue-on-error: true
        run: npm run test:solid

      - name: Solid typecheck
        id: typecheck
        if: always()
        continue-on-error: true
        run: npm run typecheck:solid

      - name: Solid build
        id: build
        if: always()
        continue-on-error: true
        run: npm run build:solid

      - name: Fail if a diagnostic stage failed
        if: always()
        env:
          ROOT: ${{ steps.root.outcome }}
          SOLID: ${{ steps.solid.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          echo "root=$ROOT solid=$SOLID typecheck=$TYPECHECK build=$BUILD"
          test "$ROOT" = success
          test "$SOLID" = success
          test "$TYPECHECK" = success
          test "$BUILD" = success
