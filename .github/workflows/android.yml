name: Android app

# Builds the signed APK and publishes it as the "android" release (download
# Calendar.apk there to install or update). The app loads the calendar from
# calendar.guymichaely.com, so only native changes need a new APK.
on:
  push:
    branches: [prototype2]
    paths: [android/**, capacitor.config.ts, package.json, bun.lock, .github/workflows/android.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install locked dependencies
        run: ./scripts/bun install --frozen-lockfile
      - name: Build the web files and sync the Android project
        run: ./scripts/bun run android:sync
      - name: Build the signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.${{ github.run_number }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::The signing key secrets are missing (see android/README.md)"; exit 1; }
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.p12"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          cd android && ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Calendar.apk"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Version 1.${{ github.run_number }}, built from ${GITHUB_SHA::7}. Download Calendar.apk on your phone to install or update."
          if gh release view android --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload android "$RUNNER_TEMP/Calendar.apk" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit android --notes "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create android "$RUNNER_TEMP/Calendar.apk" --title "Calendar for Android" --notes "$notes" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi
