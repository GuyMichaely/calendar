name: Diagnose Automerge flake

on:
  push:
    branches:
      - deployment-control
    paths:
      - .github/workflows/diagnose-automerge-flake.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - name: Repeat Automerge storage test
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 50); do
            if ! node --test tests/automerge-storage.test.js > /tmp/automerge-test.log 2>&1; then
              echo "failed iteration $i" > automerge-flake.txt
              cat /tmp/automerge-test.log >> automerge-flake.txt
              cat automerge-flake.txt
              exit 1
            fi
          done
          echo "passed 50 iterations" > automerge-flake.txt

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automerge-flake-diagnostic
          path: automerge-flake.txt
          retention-days: 1
