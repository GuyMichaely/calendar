name: Cleanup obsolete branches

on:
  push:
    branches:
      - deployment-control
    paths:
      - .github/workflows/cleanup-obsolete-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deployment-control
          fetch-depth: 0

      - name: Preserve deployed vanilla revision
        shell: bash
        run: |
          set -euo pipefail
          TAG="archive/vanilla-04d65983449b"
          SHA="04d65983449bacf9ee236a1e25a592faa13a18a7"
          git fetch --force origin "$SHA"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git tag "$TAG" "$SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Delete obsolete branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "agent/automerge-core"
            "agent/oidc-auth"
            "agent/pages-environment-default-branch-fix"
            "agent/remote-sync"
            "agent/remove-pages-environment-workaround"
            "agent/solid-automerge-intent-fix"
            "agent/solid-refactor"
            "agent/solid-root-cutover"
            "agent/vanilla-refactor"
            "deploy/old"
            "deploy/root"
            "deploy/vanilla"
            "tmp/manifest-cleanup"
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
