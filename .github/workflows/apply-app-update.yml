name: Apply app update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-app-update.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write app
        run: |
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          payload = ''
          Path('site/app.js').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
      - name: Commit app
        run: |
          git config user.name "calendar-update-bot"
          git config user.email "calendar-update-bot@users.noreply.github.com"
          git add site/app.js
          git commit -m "Refine task interaction semantics"
          git push
