name: Diagnose candidate build

on:
  push:
    branches:
      - deployment-control
    paths:
      - .github/workflows/diagnose-candidate-build.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deployment-control

      - uses: actions/checkout@v4
        with:
          ref: 02a18a1d46c1dc5fc11e2ef2cb29b33db087b3a4
          path: .candidate

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run exact candidate build command
        id: candidate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/build-deploy-unit.mjs --unit prod --source .candidate --output artifact-output --verify 2>&1 | tee candidate-build.log

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-build-diagnostic
          path: candidate-build.log
          retention-days: 1

      - name: Propagate result
        if: steps.candidate.outcome != 'success'
        run: exit 1
