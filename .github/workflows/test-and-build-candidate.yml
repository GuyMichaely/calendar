name: Test and Build Candidate
run-name: Test and build ${{ inputs.unit }} @ ${{ inputs.revision }}

on:
  workflow_call:
    inputs:
      unit:
        description: Deploy unit label
        required: true
        type: string
      revision:
        description: Git revision to test and build
        required: true
        type: string
  workflow_dispatch:
    inputs:
      unit:
        description: Deploy unit label
        required: true
        type: string
      revision:
        description: Git revision to test and build
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Validate inputs
        shell: bash
        env:
          UNIT: ${{ inputs.unit }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          if [[ ! "$UNIT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "Invalid unit name. Use letters, numbers, '.', '_', and '-' only, starting with an alphanumeric character." >&2
            exit 1
          fi
          if [[ -z "$REVISION" || "$REVISION" == -* ]]; then
            echo "revision must be a non-empty Git revision and may not begin with '-'." >&2
            exit 1
          fi

      - name: Check out requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
          path: .candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve exact candidate commit
        id: candidate
        shell: bash
        run: |
          SHA="$(git -C .candidate rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Requested revision did not resolve to an exact commit SHA." >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved ${{ inputs.revision }} to $SHA"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    concurrency:
      group: candidate-build-${{ inputs.unit }}-${{ needs.resolve.outputs.sha }}
      cancel-in-progress: false
    steps:
      - name: Check out deployment control
        uses: actions/checkout@v4
        with:
          ref: deployment-control

      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: .candidate

      - name: Confirm exact candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          ACTUAL_SHA="$(git -C .candidate rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refuse duplicate candidate artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/assert-candidate-artifact-absent.mjs
          "${{ inputs.unit }}"
          "${{ needs.resolve.outputs.sha }}"

      - name: Test and build candidate
        run: >-
          node scripts/build-deploy-unit.mjs
          --unit "${{ inputs.unit }}"
          --source .candidate
          --output artifact-output
          --verify

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-${{ inputs.unit }}-${{ needs.resolve.outputs.sha }}
          path: artifact-output
          if-no-files-found: error
          retention-days: 90
