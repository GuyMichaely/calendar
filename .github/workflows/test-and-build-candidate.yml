name: Test and Build Candidate
run-name: Test and build ${{ inputs.unit }} @ ${{ inputs.commit }}

on:
  workflow_call:
    inputs:
      unit:
        description: Deploy unit
        required: true
        type: string
      commit:
        description: Exact 40-character commit SHA
        required: true
        type: string
  workflow_dispatch:
    inputs:
      unit:
        description: Deploy unit
        required: true
        type: choice
        options:
          - root
          - old
          - vanilla
      commit:
        description: Exact 40-character commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Normalize inputs
        id: candidate
        shell: bash
        env:
          RAW_SHA: ${{ inputs.commit }}
        run: |
          SHA="${RAW_SHA,,}"
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Commit must be an exact 40-character SHA." >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Check out deployment control
        uses: actions/checkout@v4
        with:
          ref: deployment-control

      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          path: .candidate

      - name: Confirm exact candidate
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          ACTUAL_SHA="$(git -C .candidate rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        if: inputs.unit == 'root'
        working-directory: .candidate
        run: npm install --no-audit --no-fund

      - name: Root tests
        if: inputs.unit == 'root'
        working-directory: .candidate
        shell: bash
        run: |
          for FILE in tests/*.test.js; do
            node --test "$FILE"
          done

      - name: Solid tests
        id: solid_tests
        if: inputs.unit == 'root'
        working-directory: .candidate
        shell: bash
        run: |
          FAILED=""
          for FILE in solid/test/*.test.ts; do
            if ! node --test "$FILE"; then
              FAILED="$(basename "$FILE")"
              break
            fi
          done
          echo "failure=$FAILED" >> "$GITHUB_OUTPUT"

      - name: Record failing Solid test
        if: inputs.unit == 'root' && steps.solid_tests.outputs.failure != ''
        uses: actions/upload-artifact@v4
        with:
          name: solid-test-failure-${{ steps.solid_tests.outputs.failure }}
          path: .candidate/package.json
          retention-days: 1

      - name: Fail Solid tests
        if: inputs.unit == 'root' && steps.solid_tests.outputs.failure != ''
        run: exit 1

      - name: Solid typecheck
        if: inputs.unit == 'root'
        working-directory: .candidate
        run: npm run typecheck:solid

      - name: Build Solid root
        if: inputs.unit == 'root'
        working-directory: .candidate
        run: npm run build:solid

      - name: Stage Solid root artifact
        if: inputs.unit == 'root'
        shell: bash
        run: |
          rm -rf artifact-output
          mkdir artifact-output
          cp -R .candidate/site/solid/. artifact-output/
          test -f artifact-output/index.html

      - name: Test and build non-root candidate
        if: inputs.unit != 'root'
        run: >-
          node scripts/build-deploy-unit.mjs
          --unit "${{ inputs.unit }}"
          --source .candidate
          --output artifact-output
          --verify

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-${{ inputs.unit }}-${{ steps.candidate.outputs.sha }}
          path: artifact-output
          if-no-files-found: error
          retention-days: 90
