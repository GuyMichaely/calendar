name: Solid validation

on:
  push:
    branches:
      - agent/solid-refactor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run test:solid
      - run: npm run typecheck:solid
      - run: npm run build:solid
