name: Promote Deployment
run-name: Promote ${{ inputs.unit }} @ ${{ inputs.commit }}

on:
  workflow_call:
    inputs:
      unit:
        description: Deploy unit
        required: true
        type: string
      commit:
        description: Exact candidate 40-character commit SHA
        required: true
        type: string
  workflow_dispatch:
    inputs:
      unit:
        description: Deploy unit
        required: true
        type: choice
        options:
          - root
          - old
          - vanilla
      commit:
        description: Exact candidate 40-character commit SHA
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: deployment-promotions
  queue: max

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Normalize inputs
        id: candidate
        shell: bash
        env:
          RAW_SHA: ${{ inputs.commit }}
        run: |
          SHA="${RAW_SHA,,}"
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Commit must be an exact 40-character SHA." >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Check out current deployment control
        uses: actions/checkout@v4
        with:
          ref: deployment-control
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirm successful candidate build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/find-verification.mjs
          "${{ inputs.unit }}"
          "${{ steps.candidate.outputs.sha }}"

      - name: Update deployment manifest
        run: >-
          node scripts/update-manifest.mjs
          deployment.json
          "${{ inputs.unit }}"
          "${{ steps.candidate.outputs.sha }}"

      - name: Commit manifest
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- deployment.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Deployment manifest already contains this exact revision."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment.json
          git commit -m "Promote ${{ inputs.unit }} to ${{ steps.candidate.outputs.sha }}"
          CONTROL_SHA="$(git rev-parse HEAD)"
          git push origin HEAD:deployment-control
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "control_sha=$CONTROL_SHA" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact manifest deployment
        if: steps.commit.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/dispatch-deployment.mjs
          "${{ steps.commit.outputs.control_sha }}"
          deployment-control
