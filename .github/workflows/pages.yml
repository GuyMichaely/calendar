name: Calendar CI

on:
  push:
    branches:
      - main
      - agent/vanilla-refactor
      - agent/solid-refactor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  solid:
    if: github.ref_name == 'agent/solid-refactor'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:solid
      - run: npm run typecheck:solid
      - run: npm run build:solid
