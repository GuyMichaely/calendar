name: One-time obsolete branch cleanup

on:
  push:
    branches:
      - deployment-control
    paths:
      - .github/workflows/cleanup-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.repository.default_branch == 'deployment-control'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete obsolete branches
        shell: bash
        run: |
          set -u
          branches=(
            agent/deploy-trigger-dedupe
            agent/frontend-deployment-protocol
            agent/generated-sw-shells
            agent/pages-preview-aggregation
            agent/pages-workflow-concurrency-fix
            agent/solid-pages-preview
            agent/sw-fail-closed
            agent/sw-fail-closed-sync
            calendar-interactions-events
            calendar-projection-undo-menu
            calendar-ui-polish-sync-notes
            combine-upcoming-sleep-controls
            fix-calendar-chip-flash
            keyboard-navigation
            remove-runtime-legacy-migrations
            sleep-dark-horizons
            cleanup-temp-check
            cleanup-temp-check2
            main
          )

          failures=()
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              if ! git push origin --delete "$branch"; then
                failures+=("$branch")
              fi
            else
              echo "Already absent: $branch"
            fi
          done

          if ((${#failures[@]})); then
            printf 'Failed to delete: %s\n' "${failures[*]}" >&2
            exit 1
          fi
